name: Dependabot auto-merge
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: write
  pull-requests: write
  actions: write
jobs:
  auto-merge:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # Trusted default-branch code only. Never check out PR content.
      - name: Merge tested Dependabot commit and explicitly dispatch main CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          pr=$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" --jq \
            '.[] | select(.user.login == "dependabot[bot]" and .base.ref == "main" and .head.repo.full_name == .base.repo.full_name) | .number' | head -1)
          [ -n "$pr" ] || exit 0
          state=$(gh api "repos/$REPO/pulls/$pr" --jq .state)
          if [ "$state" = open ]; then
            [ "$(gh api "repos/$REPO/pulls/$pr" --jq .head.sha)" = "$HEAD_SHA" ] || exit 0
            gh api "repos/$REPO/pulls/$pr/merge" --method PUT -f merge_method=squash -f sha="$HEAD_SHA" --jq '.merged' | grep -qx true
          else
            [ "$(gh api "repos/$REPO/pulls/$pr" --jq .merged)" = true ] || exit 0
          fi
          # GITHUB_TOKEN merges do not trigger push workflows. Explicit dispatch does.
          gh workflow run ci.yml --repo "$REPO" --ref main
